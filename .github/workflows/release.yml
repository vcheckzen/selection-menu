name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows XP-compatible binary
        shell: cmd
        run: build_msvc.bat

      - name: Package release
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if (-not (Test-Path 'build\selection-menu.exe')) {
            throw 'build\selection-menu.exe was not produced'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $safeTag = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '_'
          $archive = Join-Path 'dist' "selection-menu-$safeTag-win32.zip"
          Compress-Archive -LiteralPath @(
            'build\selection-menu.exe',
            'README.md',
            'DEVELOPMENT.md'
          ) -DestinationPath $archive -Force
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $args = @(
            'release', 'create', $env:RELEASE_TAG,
            $env:RELEASE_ARCHIVE,
            '--target', $env:GITHUB_SHA,
            '--title', $env:RELEASE_TAG,
            '--notes', "Windows XP–Windows 11 release built from $($env:GITHUB_SHA)."
          )
          if ($env:PRERELEASE -eq 'true') {
            $args += '--prerelease'
          }
          & gh @args

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: selection-menu-release
          path: dist/*.zip
          if-no-files-found: error
